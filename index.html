(()=>{
const root=document.getElementById('little-house-v3');if(!root)return;const q=s=>root.querySelector(s);const qa=s=>[...root.querySelectorAll(s)];
const rooms=[{id:'living',name:'Living room',icon:'🛋️',wall:'#efd4c4',floor:'#f1e4d6'},{id:'kitchen',name:'Kitchen',icon:'🍋',wall:'#c5e3d2',floor:'#e4ebdc'},{id:'bedroom',name:'Bedroom',icon:'🌜',wall:'#ded0ea',floor:'#f0e3da'},{id:'studio',name:'Play room',icon:'🎨',wall:'#cbdfea',floor:'#e6e1d9'}];
const catalog={furniture:[['sofa','Sofa','🛋️','wide'],['bed','Bed','🛏️','big'],['chair','Chair','🪑','small'],['table','Table','🍽️','small'],['desk','Desk','🖥️','wide'],['books','Bookcase','📚','tall'],['tv','TV','📺','small'],['fridge','Fridge','🧊','tall'],['dresser','Dresser','🗄️','tall'],['oven','Stove','🍳','small'],['bath','Bathtub','🛁','wide'],['piano','Piano','🎹','wide']],decor:[['plant','Plant','🪴','small'],['rug','Rug','🧶','wide'],['art','Artwork','🖼️','small'],['flowers','Flowers','💐','small'],['lamp','Lamp','💡','small'],['mirror','Mirror','🪞','small'],['clock','Clock','🕰️','small'],['vase','Vase','🏺','small'],['toy','Teddy bear','🧸','small'],['cat','Cat','🐈','small'],['dog','Dog','🐕','small'],['window','Window','🪟','small']],people:[['ava','Ava','👩🏽','small'],['leo','Leo','👨🏻','small'],['mila','Mila','👩🏾‍🦱','small'],['noah','Noah','🧑🏼‍🦱','small'],['emma','Emma','👩🏻‍🦰','small'],['kai','Kai','👨🏽','small'],['zoe','Zoe','👧🏻','small'],['sam','Sam','🧒🏾','small']]};
const lookup={};Object.keys(catalog).forEach(k=>catalog[k].forEach(([id,label,icon,size])=>lookup[id]={label,icon,kind:k,size}));const walls=['#efd4c4','#c5e3d2','#ded0ea','#cbdfea','#f2dfad','#efbfcf'];const floors=['#f1e4d6','#e4ebdc','#f0e3da','#e6e1d9','#f5edca','#e0e4ed'];let seq=0;
const mk=(room,type,x,y)=>({id:'obj'+(++seq),room,type,x,y,angle:0,name:lookup[type].label});
function starter(){seq=0;return {items:[mk('living','sofa',.26,.39),mk('living','plant',.75,.71),mk('living','ava',.72,.40),mk('living','rug',.32,.72),mk('kitchen','table',.38,.51),mk('kitchen','fridge',.79,.32),mk('kitchen','oven',.72,.75),mk('bedroom','bed',.29,.58),mk('bedroom','lamp',.75,.62),mk('studio','desk',.34,.42),mk('studio','books',.79,.3),mk('studio','leo',.65,.74)],colors:Object.fromEntries(rooms.map(r=>[r.id,{wall:r.wall,floor:r.floor}]))};}
const key='little-house-v3-save';let data;try{data=JSON.parse(localStorage.getItem(key))}catch(e){}if(!data||!Array.isArray(data.items)||!data.colors||!rooms.every(r=>data.colors[r.id]))data=starter();else seq=Math.max(0,...data.items.map(i=>Number(String(i.id).replace(/\D/g,''))||0));
let active='living',tab='furniture',selected=null,live=false,tick=null,pointer=null,catalogDrag=null,suppressHouseClick=false,suppressCatalogClick=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}};
const item=()=>data.items.find(x=>x.id===selected);
function say(msg){q('#lh-msg').textContent=msg;}
function spriteInner(type){return type==='sofa'?'<i></i>':type==='bed'?'<i></i>':type==='person'?'<span class="eyes"></span><span class="smile"></span>':''}
function pieceHTML(i){const v=lookup[i.type];if(!v)return '';const person=v.kind==='people';const cls=["lh-piece",person?'person':'',v.size||'',`type-${i.type}`,i.id===selected?'selected':''].filter(Boolean).join(' ');const spriteClass=person?'sprite-person':`sprite-${i.type}`;return `<div class="${cls}" data-piece="${i.id}" style="left:${i.x*100}%;top:${i.y*100}%;--angle:${i.angle||0}deg" title="${esc(i.name)}"><div class="lh-sprite ${spriteClass}">${spriteInner(person?'person':i.type)}</div><div class="lh-label">${esc(i.name)}</div></div>`}
function render(){q('#lh-counts').textContent='🪑 '+data.items.filter(i=>lookup[i.type]?.kind!=='people').length+'  ·  😊 '+data.items.filter(i=>lookup[i.type]?.kind==='people').length;
q('#lh-add-location').textContent='Adding to: '+rooms.find(r=>r.id===active).name;
q('#lh-house').innerHTML=rooms.map(r=>{const c=data.colors[r.id];return `<div class="lh-room ${active===r.id?'active-room':''}" data-room="${r.id}" style="--wall:${c.wall};--floor:${c.floor}"><button class="lh-room-label" data-room-select="${r.id}">${r.icon} ${r.name}</button><div class="lh-window"></div><div class="lh-door"></div>${data.items.filter(i=>i.room===r.id&&lookup[i.type]).map(pieceHTML).join('')}</div>`}).join('');
qa('.lh-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));q('#lh-items').innerHTML=catalog[tab].map(([id,label,icon])=>`<button class="lh-catalog" data-add="${id}" title="Add ${label}"><span class="lh-emoji">${icon}</span><span>${esc(label)} ＋</span></button>`).join('');q('#lh-life').classList.toggle('active',live);q('#lh-life').textContent=live?'⏸ Pause':'▶ Life';
const s=item();if(s){const v=lookup[s.type];q('#lh-editor').innerHTML=`<div class="lh-editor-title"><span>${v.icon} ${esc(s.name)}</span><small>Selected</small></div>${v.kind==='people'?`<div class="lh-edit-line"><label>Name</label><input id="lh-name" value="${esc(s.name)}" maxlength="20"></div>`:''}<div class="lh-edit-line"><label>Room</label><select id="lh-destination">${rooms.map(r=>`<option value="${r.id}" ${r.id===s.room?'selected':''}>${r.name}</option>`).join('')}</select></div><div class="lh-edit-controls"><button data-edit="rotate">↻ Rotate</button><button data-edit="copy">＋ Copy</button><button data-edit="delete">✕ Remove</button></div>`;
q('#lh-hint').textContent='✋ Drag '+s.name+' to move it, or tap a free spot in its room.';
}else{const c=data.colors[active],r=rooms.find(r=>r.id===active);q('#lh-editor').innerHTML=`<div class="lh-editor-title"><span>🎨 Room colors</span><small>${r.name}</small></div><div class="lh-colors"><label>Walls</label>${walls.map(col=>`<button class="lh-color ${c.wall===col?'chosen':''}" data-color="${col}" data-color-key="wall" style="background:${col}" aria-label="Wall ${col}"></button>`).join('')}</div><div class="lh-colors"><label>Floors</label>${floors.map(col=>`<button class="lh-color ${c.floor===col?'chosen':''}" data-color="${col}" data-color-key="floor" style="background:${col}" aria-label="Floor ${col}"></button>`).join('')}</div>`;
q('#lh-hint').textContent='Drag a furnishing into any room or tap to add it to the '+r.name.toLowerCase()+'.';}}
function freePos(room){const spots=[[.53,.62],[.24,.72],[.76,.62],[.49,.40],[.25,.43],[.76,.37],[.48,.78],[.74,.79],[.28,.83],[.5,.28]];const current=data.items.filter(i=>i.room===room);return spots.map(([x,y])=>({x,y,d:Math.min(...current.map(i=>Math.hypot(x-i.x,y-i.y)),1)})).sort((a,b)=>b.d-a.d)[0];}
function addTo(type,room,p){const o=mk(room,type,p.x,p.y);data.items.push(o);active=room;selected=o.id;save();render();say('✅ '+lookup[type].label+' added to the '+rooms.find(r=>r.id===room).name.toLowerCase()+'. Drag to move it!');}
function add(type){addTo(type,active,freePos(active));}
function hoveredRoom(e){return document.elementFromPoint(e.clientX,e.clientY)?.closest('.lh-room');}
function markDrop(room){qa('.lh-room').forEach(el=>el.classList.toggle('drop-target',el===room));}
function clearDrop(){qa('.lh-room').forEach(el=>el.classList.remove('drop-target'));}
function xy(e,room){let rect=room.getBoundingClientRect();return{x:Math.min(.87,Math.max(.13,(e.clientX-rect.left)/rect.width)),y:Math.min(.85,Math.max(.25,(e.clientY-rect.top)/rect.height))};}
q('#lh-house').addEventListener('click',e=>{if(suppressHouseClick){suppressHouseClick=false;return;}if(e.target.closest('[data-room-select]')){active=e.target.closest('[data-room-select]').dataset.roomSelect;selected=null;render();say('Selected '+rooms.find(r=>r.id===active).name+'. Tap furniture or decor to add it.');return;}if(e.target.closest('[data-piece]'))return;const room=e.target.closest('[data-room]');if(!room)return;active=room.dataset.room;const s=item();if(s&&s.room===active){const p=xy(e,room);s.x=p.x;s.y=p.y;save();render();say('Moved '+s.name+'.');}else{selected=null;render();say('Selected '+rooms.find(r=>r.id===active).name+'. Choose an item below to add it.');}});
// Keep the same DOM element alive from pointerdown until pointerup. Rebuilding it breaks pointer capture.
q('#lh-house').addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-piece]');if(!el)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const s=data.items.find(i=>i.id===el.dataset.piece);if(!s)return;
  selected=s.id;active=s.room;
  pointer={id:s.id,pointerId:e.pointerId,el,room:el.closest('.lh-room'),x:e.clientX,y:e.clientY,moved:false};
  qa('.lh-piece').forEach(n=>n.classList.toggle('selected',n===el));
  try{el.setPointerCapture(e.pointerId)}catch(_){}
});
q('#lh-house').addEventListener('pointermove',e=>{
  if(!pointer||pointer.pointerId!==e.pointerId)return;
  const s=data.items.find(i=>i.id===pointer.id);if(!s)return;
  if(!pointer.moved&&Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)<5)return;
  pointer.moved=true;
  const destination=hoveredRoom(e);
  markDrop(destination&&destination!==pointer.room?destination:null);
  const p=xy(e,pointer.room);
  s.x=p.x;s.y=p.y;
  pointer.el.style.left=(100*p.x)+'%';pointer.el.style.top=(100*p.y)+'%';
  e.preventDefault();
});
function endPointer(e){
  if(!pointer||pointer.pointerId!==e.pointerId)return;
  const drag=pointer;pointer=null;
  const s=data.items.find(i=>i.id===drag.id);
  const room=drag.moved?hoveredRoom(e):null;
  if(s&&room){s.room=room.dataset.room;const p=xy(e,room);s.x=p.x;s.y=p.y;active=s.room;}
  clearDrop();
  if(drag.moved){suppressHouseClick=true;setTimeout(()=>{suppressHouseClick=false},0);}
  save();render();
  say(drag.moved?(room&&room!==drag.room?'✅ Moved to '+rooms.find(r=>r.id===s.room).name+'.':'✅ Furniture moved.'):'Selected '+(s?.name||'item')+'. Drag it or use the editor.');
}
q('#lh-house').addEventListener('pointerup',endPointer);
q('#lh-house').addEventListener('pointercancel',endPointer);

// Drag a catalog item straight into a room, while retaining tap-to-add.
q('#lh-items').addEventListener('pointerdown',e=>{
  const btn=e.target.closest('[data-add]');if(!btn)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  catalogDrag={pointerId:e.pointerId,btn,type:btn.dataset.add,x:e.clientX,y:e.clientY,moved:false,ghost:null};
  try{btn.setPointerCapture(e.pointerId)}catch(_){}
});
q('#lh-items').addEventListener('pointermove',e=>{
  const d=catalogDrag;if(!d||d.pointerId!==e.pointerId)return;
  if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<8)return;
  if(!d.moved){
    d.moved=true;
    const v=lookup[d.type];d.ghost=document.createElement('div');
    d.ghost.className='lh-drag-ghost';
    d.ghost.innerHTML='<div class="lh-sprite '+(v.kind==='people'?'sprite-person':'sprite-'+d.type)+'">'+spriteInner(v.kind==='people'?'person':d.type)+'</div>';
    document.body.appendChild(d.ghost);
  }
  d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';
  markDrop(hoveredRoom(e));e.preventDefault();
});
function endCatalogDrag(e){
  const d=catalogDrag;if(!d||d.pointerId!==e.pointerId)return;
  const room=d.moved&&e.type!=='pointercancel'?hoveredRoom(e):null;
  if(d.ghost)d.ghost.remove();catalogDrag=null;clearDrop();
  if(d.moved){
    suppressCatalogClick=true;setTimeout(()=>{suppressCatalogClick=false},0);
    if(room){addTo(d.type,room.dataset.room,xy(e,room));}
    else say('Drop furniture inside a room to place it. Tap an item to add it to the selected room.');
  }
}
q('#lh-items').addEventListener('pointerup',endCatalogDrag);
q('#lh-items').addEventListener('pointercancel',endCatalogDrag);
q('#lh-items').addEventListener('click',e=>{if(suppressCatalogClick){suppressCatalogClick=false;return;}const btn=e.target.closest('[data-add]');if(btn)add(btn.dataset.add);});
qa('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;selected=null;render();}));
q('#lh-editor').addEventListener('click',e=>{const sw=e.target.closest('[data-color]');if(sw){data.colors[active][sw.dataset.colorKey]=sw.dataset.color;save();render();return;}const ed=e.target.closest('[data-edit]');if(!ed||!item())return;const s=item();if(ed.dataset.edit==='rotate')s.angle=((s.angle||0)+45)%360;if(ed.dataset.edit==='copy'){let p=freePos(s.room);let copy=mk(s.room,s.type,p.x,p.y);copy.name=s.name;data.items.push(copy);selected=copy.id;}if(ed.dataset.edit==='delete'){data.items=data.items.filter(i=>i.id!==selected);selected=null;}save();render();say('✅ House updated.');});
q('#lh-editor').addEventListener('change',e=>{const s=item();if(!s)return;if(e.target.id==='lh-destination'){s.room=e.target.value;active=s.room;const p=freePos(active);s.x=p.x;s.y=p.y;}else if(e.target.id==='lh-name'){s.name=e.target.value.trim().slice(0,20)||lookup[s.type].label;}else return;save();render();say('✅ Updated '+s.name+'.');});
q('#lh-cozy').addEventListener('click',()=>{[['living','flowers'],['kitchen','plant'],['bedroom','rug'],['studio','toy']].forEach(([room,type])=>{let spot=freePos(room);data.items.push(mk(room,type,spot.x,spot.y))});selected=null;save();render();say('✨ Added four decorations, one to each room!');});
q('#lh-life').addEventListener('click',()=>{live=!live;if(tick)clearInterval(tick);tick=null;if(live){tick=setInterval(()=>{if(pointer)return;data.items.filter(i=>lookup[i.type]?.kind==='people').forEach(s=>{s.x=Math.min(.86,Math.max(.16,s.x+(Math.random()-.5)*.18));s.y=Math.min(.84,Math.max(.3,s.y+(Math.random()-.5)*.16));const el=q(`[data-piece="${s.id}"]`);if(el){el.style.left=(s.x*100)+'%';el.style.top=(s.y*100)+'%';}});save();},1300);}render();say(live?'▶ People are moving around!':'⏸ Life paused.');});
q('#lh-reset').addEventListener('click',()=>{if(!confirm('Start over with the original house?'))return;data=starter();selected=null;active='living';save();render();say('🏡 Fresh house ready to decorate!');});
render();
})();
</script></body></html>
